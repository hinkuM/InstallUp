- name: Change public keys in all computers
  hosts: all
  gather_facts: false
  pre_tasks:
    - name: Gather minimal facts as regular user (No sudo required)
      setup:
        gather_subset:
          - min
      become: false
      tags: ["always"]

    - name: Dynamically set sudo executable based on Ubuntu version
      set_fact:
        ansible_become_exe: "{{ 'sudo.ws' if (ansible_facts['distribution_major_version'] == '26') else 'sudo' }}"
      become: false
      tags: ["always"]

    - name: Dynamically set become
      set_fact:
        ansible_become: true
      become: false
      tags: ["always"]
  tasks:
    - name: Set up multiple authorized keys
      ansible.posix.authorized_key:
        user: deploy
        state: present
        key: "{{ lookup('ansible.builtin.file', item) }}"
        exclusive: false # true - delete all keys and use only these below, false - add to existing ones
      with_fileglob:
        - "ssh_keys/*.pub"