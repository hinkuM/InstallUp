- name: Ensure resolv.conf in posftix is owned by root
  ansible.builtin.file:
    path: "/var/spool/postfix/etc/resolv.conf"
    owner: "root"
    group: "root"
    mode: "0644"
  tags: ["postfix", "file"]

###### Handler & Log section ######

- name: Restart Postfix
  ansible.builtin.service:
    name: "postfix"
    state: "restarted"
  tags: ["postfix", "handler"]

- name: Enable Postfix
  ansible.builtin.service:
    name: "postfix"
    enabled: true
  tags: ["postfix", "handler"]

- name: Set Postfix log file
  ansible.builtin.command: |
    postfix stop && postconf maillog_file=/var/log/mail.log && postfix start
  tags: ["postfix", "install"]