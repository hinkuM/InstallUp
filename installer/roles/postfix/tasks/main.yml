###### Apt section ######

- name: Set postfix debconf selections
  ansible.builtin.shell: |
    echo "postfix postfix/main_mailer_type string 'Internet Site'" | debconf-set-selections
    echo "postfix postfix/mailname string {{ domains.main.name }}" | debconf-set-selections
    echo "postfix postfix/relayhost string {{ relay_host }}" | debconf-set-selections
  tags: ["postfix", "install"]

- name: Install Postfix and plugins
  ansible.builtin.apt:
    name: 
      - "{{ postfix }}"
      - "{{ postfix_mysql }}"
      - "{{ postfix_pcre }}"
  tags: ["postfix", "install"]

- name: Prevent specific packages from being updated (Hold)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - "{{ postfix }}"
    - "{{ postfix_mysql }}"
    - "{{ postfix_pcre }}"
  tags: ["postfix", "install"]

###### Config section ######

- name: Create directory for postfix sni map
  ansible.builtin.file:
    path: "/etc/postfix/tls"
    owner: "root"
    group: "root"
    state: "directory"
    mode: "0640"
  tags: ["postfix", "file"]

- name: Merge privkey + fullchain for all SNI domains
  shell: |
    cat /etc/letsencrypt/live/{{ item.cert_domain }}/privkey.pem /etc/letsencrypt/live/{{ item.cert_domain }}/fullchain.pem > /etc/postfix/tls/{{ item.domain }}.pem
  loop: "{{ cert_and_mail_data }}"
  tags: ["postfix", "file"]

- name: Overwrite config templates
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/postfix/{{ item }}"
    owner: "root"
    group: "root"
    mode: "0644"
  loop:
    - "local-transport.pcre"
    - "main.cf"
    - "master.cf"
    - "mysql-sender-login.cf"
    - "mysql-virtual-domains.cf"
    - "mysql-virtual-mailbox-maps.cf"
    - "sender-transport.pcre"
    - "sni-map.map"
    - "list_unsub_header"
  no_log: true
  tags: ["postfix", "file"]

- name: Rebuild postfix maps
  command: "postmap -F hash:/etc/postfix/sni-map.map"
  tags: ["postfix", "file"]

