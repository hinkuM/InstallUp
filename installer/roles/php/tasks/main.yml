###### Apt section ######

- name: Ensure universe repository is enabled
  ansible.builtin.apt_repository:
    repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_facts.distribution_release }} universe"
    state: present
  tags: ["php", "install"]

- name: Install {{ php_version }} and required extensions
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - "{{ php_fpm }}"
    - "{{ php_cli }}"
    - "{{ php_mysql }}"
    - "php-pear"
    - "{{ php_mbstring }}"
    - "{{ php_intl }}"
    - "{{ php_xml }}"
    - "{{ php_curl }}"
    - "{{ php_zip }}"
    - "{{ php_gd }}"
    - "{{ pexpect }}"
  tags: ["php", "install"]

- name: Prevent specific packages from being updated (Hold)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - "{{ php_fpm }}"
    - "{{ php_cli }}"
    - "{{ php_mysql }}"
    - "php-pear"
    - "{{ php_mbstring }}"
    - "{{ php_intl }}"
    - "{{ php_xml }}"
    - "{{ php_curl }}"
    - "{{ php_zip }}"
    - "{{ php_gd }}"
    - "{{ pexpect }}"
  tags: ["php", "install"]

###### Config section ######

- name: Update PHP post_max_size
  ansible.builtin.lineinfile:
    path: /etc/php/{{ php_version_number }}/fpm/php.ini
    regexp: '^post_max_size\s*='
    line: 'post_max_size = {{ post_max_size }}'
    backup: yes
  tags: ["php", "file"]

- name: Update PHP upload_max_filesize
  ansible.builtin.lineinfile:
    path: /etc/php/{{ php_version_number }}/fpm/php.ini
    regexp: '^upload_max_filesize\s*='
    line: 'upload_max_filesize = {{ upload_max_filesize }}'
    backup: yes
  tags: ["php", "file"]

###### Handler section ######

- name: Restart php-fpm
  ansible.builtin.service:
    name: "{{ php_version }}-fpm.service"
    state: "restarted"
  tags: ["php", "handler"]

- name: Enable php-fpm
  ansible.builtin.service:
    name: "{{ php_version }}-fpm.service"
    enabled: true
  tags: ["php", "handler"]
