###### Package section ######

- name: Update repositories
  ansible.builtin.apt:
    update_cache: true
  tags: ["system", "install"]

- name: Install/Update basic packages
  ansible.builtin.apt:
    name: 
      - "{{ gnupg }}"
      - "{{ curl }}"
      - "{{ wget }}"
      - "{{ openssh_server }}"
      - "{{ iptables }}"
      - "{{ iptables_persistent }}"
      - "{{ cron }}"
      - "{{ lsb_release }}"
      - "{{ ca_certificates }}"
      - "{{ apt_transport_https }}"
      - "{{ systemd_timesyncd }}"
    state: "present"
  tags: ["system", "install"]

- name: Prevent specific packages from being updated (Hold)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - "{{ gnupg }}"
    - "{{ curl }}"
    - "{{ wget }}"
    - "{{ openssh_server }}"
    - "{{ iptables }}"
    - "{{ iptables_persistent }}"
    - "{{ cron }}"
    - "{{ lsb_release }}"
    - "{{ ca_certificates }}"
    - "{{ apt_transport_https }}"
    - "{{ systemd_timesyncd }}"
  tags: ["system", "install"]

###### System section ######

- name: Disable swap
  ansible.posix.mount:
    name: "{{ item }}"
    fstype: "swap"
    state: "absent"
  loop: ["none", "swap"]
  tags: ["system"]

- name: Force swap off immediately
  ansible.builtin.command: swapoff -a
  tags: ["system"]
  
- name: Limit systemd journal size to 500M
  ansible.builtin.lineinfile:
    path: "/etc/systemd/journald.conf"
    regexp: "^#?\\s*SystemMaxUse="
    line: "SystemMaxUse=500M"
    insertafter: "^\\[Journal\\]"
    state: "present"
  tags: ["system"]

- name: Restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  tags: ["system"]

- name: Set system timezone
  community.general.timezone:
    name: "{{ target_timezone }}"
  register: tz_change
  tags: ["system"]

- name: Enable NTP network synchronization
  ansible.builtin.command: "timedatectl set-ntp true"
  tags: ["system"]

- name: Force immediate time synchronization sync
  ansible.builtin.service:
    name: "systemd-timesyncd"
    state: "restarted"
    enabled: true
  tags: ["system"]

###### Basic directories section ######

- name: Create directory for apt keyrings
  ansible.builtin.file:
    path: "/etc/apt/keyrings"
    state: "directory"
    mode: "0755"
  tags: ["system"]

###### Certificates section ######

- name: Ensure group "client_certs" exists
  ansible.builtin.group:
    name: "client_certs"
    state: "present"
  tags: ["system", "certificates"]

- name: Create directories for certificates
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "root"
    group: "root"
    state: "directory"
    mode: "0555"
  loop:
    - "{{ self_certs }}"
    - "{{ clients_cert_dir }}"
  tags: ["system", "certificates"]

- name: Copy certificates to this pc
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/client_certificates/{{ ansible_hostname }}/{{ ansible_hostname }}-{{item}}"
    dest: "{{ clients_cert_dir }}/client-{{ item }}"
    mode: "0640"
    owner: "root"
    group: "client_certs"
  loop: 
    - "key.pem"
    - "crt.pem"
  no_log: true
  when: "'logs' not in group_names"
  tags: ["system", "file", "certificates"]

- name: Copy root CA certificate to this pc
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/client_certificates/root-ca.pem"
    dest: "{{ clients_cert_dir }}/root-ca.pem"
    mode: "0640"
    owner: "root"
    group: "client_certs"
  no_log: true
  when: "'logs' not in group_names"
  tags: ["system", "file", "certificates"]

###### Users section ######

- name: Change root password
  ansible.builtin.user:
    name: "root"
    password: "{{ root_password | password_hash('sha512') }}"
  no_log: true
  tags: ["system"]

