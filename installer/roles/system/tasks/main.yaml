###### Network section (Only mail group) ######

- name: Ensure all domains are present in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.0\.1[ \t]+'
    line: "127.0.0.1 localhost {{ cert_and_mail_data | map(attribute='cert_domain') | join(' ') }}"
    state: present
    backup: yes
  when: "'mail' in group_names"
  no_log: true
  tags: ["system"]

###### Backup section (only logs group) ######

- name: Install nfs for kubernetes users' files backup
  ansible.builtin.apt:
    name: "{{ nfs_common }}"
    state: "present"
  when: "'logs' in group_names"
  tags: ["system"]


- name: Prevent specific packages from being updated (Hold)
  ansible.builtin.dpkg_selections:
    name: "{{ nfs_common }}"
    selection: hold
  when: "'logs' in group_names"
  tags: ["system", "install"]

- name: Create the backup user
  ansible.builtin.user:
    name: "{{ backup_user }}"
    shell: "/bin/sh"
    password: "{{ backup_password | password_hash('sha512') }}"
  when: "'logs' in group_names"
  no_log: true
  tags: ["system"]

- name: Create backup directories
  ansible.builtin.file:
    path: 
      - "{{ backup_dir }}"
      - "{{ backup_keys_dir }}"
      - "{{ backup_user_data_dir }}"
      - "{{ backup_mail_dir }}"
    owner: "{{ backup_user }}"
    group: "{{ backup_user }}"
    state: "directory"
    mode: "0640"
  when: "'logs' in group_names"
  tags: ["system"]
