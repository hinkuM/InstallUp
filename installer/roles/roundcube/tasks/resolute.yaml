- name: Check if Roundcube is already installed
  ansible.builtin.stat:
    path: "/usr/share/roundcube/index.php"
  register: "roundcube_installed"
  tags: ["roundcube", "install"]

- name: Clean up old installation
  ansible.builtin.file:
    path: "/usr/share/roundcube"
    state: "absent"
  when: "not roundcube_installed.stat.exists"
  tags: ["roundcube", "install"]

- name: Ensure target directory exists
  ansible.builtin.file:
    path: "/usr/share/roundcube"
    state: "directory"
    owner: "www-data"
    group: "www-data"
    mode: "0750"
  tags: ["roundcube", "file"]

- name: Download and extract Roundcube complete archive directly from GitHub
  ansible.builtin.unarchive:
    src: "https://github.com/roundcube/roundcubemail/releases/download/1.7.0/roundcubemail-1.7.0-complete.tar.gz"
    dest: "/usr/share/roundcube"
    remote_src: yes
    extra_opts: [--strip-components=1]
    creates: "/usr/share/roundcube/index.php"
  tags: ["roundcube", "install"]

- name: Ensure logs and temp directories are writable by webserver
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "www-data"
    group: "www-data"
    mode: "0750"
  loop:
    - "/usr/share/roundcube/logs"
    - "/usr/share/roundcube/temp"
  tags: ["roundcube", "file"]

- name: Overwrite config files (templates)
  ansible.builtin.template:
    src: "{{ item.source }}"
    dest: "{{ item.destination }}"
    owner: "www-data"
    group: "www-data"
    mode: "0750"
  loop:
    - source: "roundcube.conf.j2"
      destination: "/usr/share/roundcube/roundcube.conf"
    - source: "config.inc.php.j2"
      destination: "/usr/share/roundcube/config/config.inc.php"
  no_log: true
  tags: ["roundcube", "file"]

