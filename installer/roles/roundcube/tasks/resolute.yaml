###### Apt section ######

- name: Install dependencies needed for UI
  ansible.builtin.apt:
    name: 
      - "node-less"
      - "node-clean-css"
    state: "present"
  tags: ["roundcube", "install"]

###### Frontend section ######

- name: Compile Roundcube Elastic skin LESS files to minified CSS
  ansible.builtin.command: "lessc --clean-css styles/{{ item }}.less styles/{{ item }}.min.css"
  args:
    chdir: /usr/share/roundcube/skins/elastic
  loop:
    - styles
    - print
    - embed
  tags: ["roundcube"]

- name: Update frontend for roundcube
  ansible.builtin.command:
    cmd: "php ./updatecss.sh"
    chdir: "/usr/share/roundcube/bin"
  tags: ["roundcube"]

###### Config section ######

- name: Overwrite plugins
  ansible.builtin.template:
    src: "{{ item.source }}"
    dest: "{{ item.destination }}"
    owner: "www-data"
    group: "www-data"
    mode: "0750"
  loop:
    - source: "managesieve.j2"
      destination: "/usr/share/roundcube/plugins/managesieve/config.inc.php"
    - source: "password.j2"
      destination: "/usr/share/roundcube/plugins/password/config.inc.php"
