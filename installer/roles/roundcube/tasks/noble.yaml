###### Apt section ######

- name: Install Roundcube
  ansible.builtin.apt:
    name: 
      - "{{ roundcube }}"
      - "{{ roundcube_plugins }}"
    state: "present"
  tags: ["roundcube", "install"]

###### Config section ######

- name: Overwrite config files (templates)
  ansible.builtin.template:
    src: "{{ item.source }}"
    dest: "{{ item.destination }}"
    owner: "www-data"
    group: "www-data"
    mode: "0640"
  loop:
    - source: "roundcube.conf.j2"
      destination: "/etc/dbconfig-common/roundcube.conf"
    - source: "config.inc.php.j2"
      destination: "/etc/roundcube/config.inc.php"
  no_log: true
  tags: ["roundcube", "file"]

- name: Symlink Roundcube config from /etc to the install directory
  ansible.builtin.file:
    src: "/etc/roundcube/config.inc.php"
    dest: "/usr/share/roundcube/config.inc.php"
    state: "link"
    force: true
  no_log: true
  tags: ["roundcube", "file"]

- name: Overwrite config files (not templates)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "www-data"
    group: "www-data"
    mode: "0640"
  loop:
    - src: "composer.json"
      dest: "/usr/share/roundcube/composer.json"
  tags: ["roundcube", "file"]

- name: Grant user ownership of the Roundcube directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "www-data"
    group: "www-data" 
    mode: "0750"
    recurse: true
  loop:
    - "/etc/roundcube"
    - "/usr/share/roundcube"
  tags: ["roundcube"]

- name: Create directory for roundcube logs
  ansible.builtin.file:
    path: "/var/log/roundcube/"
    state: "directory"
    owner: "root"
    group: "www-data" 
    mode: "0770"
  tags: ["roundcube"]

- name: Ensure correct ownership
  ansible.builtin.file:
    path: /usr/share/roundcube/plugins
    state: directory
    owner: www-data
    group: www-data
    recurse: true
  tags: ["roundcube"]

- name: Trust the Roundcube 2FA directory in Git
  ansible.builtin.command:
    cmd: "git config --global --add safe.directory /usr/share/roundcube/plugins/twofactor_gauthenticator"
  changed_when: false
  tags: ["roundcube", "install"]

- name: Clone 2FA repo
  ansible.builtin.git:
    repo: "https://github.com/alexandregz/twofactor_gauthenticator.git"
    dest: "/usr/share/roundcube/plugins/twofactor_gauthenticator"
    version: "master"
    force: true
  tags: ["roundcube", "install"]

