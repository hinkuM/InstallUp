- name: Symlink roundcube plugin from usr to var
  ansible.builtin.file:
    src: "/usr/share/roundcube/plugins/twofactor_gauthenticator"
    dest: "/var/lib/roundcube/plugins/twofactor_gauthenticator"
    state: "link"
    force: true
  no_log: true
  tags: ["roundcube", "file"]

- name: Overwrite plugins
  ansible.builtin.template:
    src: "{{ item.source }}"
    dest: "{{ item.destination }}"
    owner: "www-data"
    group: "www-data"
    mode: "0640"
  loop:
    - source: "two-factor.j2"
      destination: "/usr/share/roundcube/plugins/twofactor_gauthenticator/config.inc.php"
    - source: "managesieve.j2"
      destination: "/etc/roundcube/plugins/managesieve/config.inc.php"
    - source: "password.j2"
      destination: "/etc/roundcube/plugins/password/config.inc.php"
  # no_log: true
  tags: ["roundcube", "file"]

- name: Apply debconf changes
  ansible.builtin.command: "dpkg-reconfigure -f noninteractive roundcube-core"
  tags: ["roundcube"]