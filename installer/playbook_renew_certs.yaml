- name: Create new certificates
  hosts: logs
  gather_facts: false
  pre_tasks:
    - name: Gather minimal facts as regular user (No sudo required)
      setup:
        gather_subset:
          - min
      become: false
      tags: ["always"]

    - name: Dynamically set sudo executable based on Ubuntu version
      set_fact:
        ansible_become_exe: "{{ 'sudo.ws' if (ansible_facts['distribution_major_version'] == '26') else 'sudo' }}"
      become: false
      tags: ["always"]

    - name: Dynamically set become
      set_fact:
        ansible_become: true
      become: false
      tags: ["always"]

    - name: Delete old certificates
      ansible.builtin.file:
        path: "{{ item }}"
        state: "absent"
      loop:
        - "{{ root_ca_key_dir }}"
        - "{{ root_ca_dir }}/root-ca.pem"
        - "{{ wazuh_indexer_cert_dir }}"
        - "{{ wazuh_dashboard_cert_dir }}"
        - "{{ wazuh_manager_cert_dir }}"
        - "{{ filebeat_cert_dir }}"
        - "{{ grafana_cert_dir }}"
        - "{{ loki_cert_dir }}"
        - "{{ prometheus_cert_dir }}"
        - "{{ clients_cert_dir }}"
      tags: ["ca"]

    - name: Delete old certificates
      ansible.builtin.file:
        path: "{{ item }}"
        state: "absent"
      loop:
        - "{{ wazuh_indexer_cert_dir }}"
        - "{{ wazuh_dashboard_cert_dir }}"
        - "{{ wazuh_manager_cert_dir }}"
        - "{{ filebeat_cert_dir }}"
        - "{{ grafana_cert_dir }}"
        - "{{ loki_cert_dir }}"
        - "{{ prometheus_cert_dir }}"
      tags: ["server"]

    - name: Delete old certificates
      ansible.builtin.file:
        path: "{{ item }}"
        state: "absent"
      loop:
        - "{{ clients_cert_dir }}"
      tags: ["clients"]
  roles:
    - certificates

###### Tags ######

# Specific modules only                                   just name of the role for example clamav or certs
# Only install packages                                   install
# Only copy or replace files/templates                    file
# Commands that should run one time (not install)           once
# Systemctl actions                                       handler
